 <!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Gestão de Desperdício</title>

    <!-- ESTILIZAÇÃO -->
    <link rel="stylesheet" href="../../public/css/style.css">
</head>

<body class="flex min-h-screen flex-col bg-background md:flex-row">

    <!-- MENU LATERAL -->
    <aside id="aside-placeholder"
        class="w-full shrink-0 md:w-[180px]"></aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="flex min-w-0 flex-1 flex-col">

        <!-- CABEÇALHO -->
        <div id="header-placeholder"></div>

        <main class="flex-1">

            <div class="w-full px-3 py-4 sm:px-6 sm:py-8">

                <!-- SAUDAÇÃO DO USUÁRIO -->
                <section
                    class="rounded-lg bg-white p-4 sm:mt-3 sm:min-h-[150px]">

                    <div
                        class="flex flex-wrap items-baseline gap-x-3 gap-y-1 sm:gap-x-5">

                        <h1 class="text-xl text-text sm:text-2xl">
                            Olá,
                        </h1>

                        <!-- NOME DA CONTA AUTENTICADA -->
                        <p id="nome-usuario"
                            class="min-w-0 max-w-full break-words text-3xl font-bold text-text-secondary sm:text-4xl lg:text-5xl">
                            Carregando...
                        </p>
                    </div>

                    <!-- ATALHOS -->
                    <div class="mt-4 flex flex-wrap items-center gap-2 text-xs">

                        <!-- TODOS OS PRODUTOS -->
                        <a href="todos-produtos.html"
                            class="cursor-pointer rounded-sm bg-primary px-2 py-1 text-white hover:bg-primary-dark">
                            Produtos
                        </a>

                        <!-- PRÓXIMOS VENCIMENTOS -->
                        <a href="#secao-vencimentos"
                            class="cursor-pointer rounded-sm bg-primary px-2 py-1 text-white hover:bg-primary-dark">
                            Próx. Vencimento
                        </a>
                    </div>
                </section>

                <!-- CARDS DOS INDICADORES -->
                <section
                    aria-label="Indicadores do Dashboard"
                    class="mt-5 flex flex-wrap items-stretch justify-center gap-5">

                    <!-- TOTAL DE PRODUTOS -->
                    <div
                        class="flex min-h-[110px] w-full max-w-[280px] flex-col items-center justify-center rounded-xl bg-white p-6 text-center font-semibold text-text shadow-md transition-all duration-300 ease-in-out hover:-translate-y-1 hover:shadow-xl sm:w-60">

                        <span id="total-produtos"
                            class="text-xl font-bold">
                            --
                        </span>

                        <span>produtos</span>
                    </div>

                    <!-- LOTES PRÓXIMOS DO VENCIMENTO -->
                    <div
                        class="flex min-h-[110px] w-full max-w-[280px] flex-col items-center justify-center rounded-xl bg-white p-6 text-center font-semibold text-text shadow-md transition-all duration-300 ease-in-out hover:-translate-y-1 hover:shadow-xl sm:w-60">

                        <span id="lotes-proximos"
                            class="text-xl font-bold">
                            --
                        </span>

                        <span>
                            lotes próx. vencimento
                        </span>
                    </div>

                    <!-- OCORRÊNCIAS DE DESPERDÍCIO -->
                    <div
                        class="flex min-h-[110px] w-full max-w-[280px] flex-col items-center justify-center rounded-xl bg-white p-6 text-center font-semibold text-text shadow-md transition-all duration-300 ease-in-out hover:-translate-y-1 hover:shadow-xl sm:w-60">

                        <span id="total-desperdicios"
                            class="text-xl font-bold">
                            --
                        </span>

                        <span>
                            ocorrências de desperdício
                        </span>
                    </div>
                </section>

                <!-- PRÓXIMOS VENCIMENTOS -->
                <section id="secao-vencimentos"
                    class="mt-6 w-full rounded-xl bg-white px-5 py-4 text-text shadow-md sm:px-10">

                    <h2 id="titulo-vencimentos"
                        class="text-xs font-medium">
                        Produtos próximos do Vencimento
                    </h2>

                    <!-- TABELA DE LOTES -->
                    <div class="mx-auto mt-4 max-w-4xl overflow-x-auto">

                        <table
                            aria-labelledby="titulo-vencimentos"
                            class="w-full min-w-[480px] table-fixed text-center text-sm font-semibold leading-tight">

                            <thead class="sr-only">
                                <tr>
                                    <th scope="col">Produto</th>
                                    <th scope="col">Quantidade</th>
                                    <th scope="col">Validade</th>
                                </tr>
                            </thead>

                            <!-- LOTES PRÓXIMOS DO VENCIMENTO -->
                            <tbody id="tabela-proximos-vencimentos">

                                <tr>
                                    <td colspan="3"
                                        class="px-3 py-4 text-center">
                                        Carregando vencimentos...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- GRÁFICO DE DESPERDÍCIO -->
                <section
                    class="mt-6 w-full rounded-xl bg-white px-5 py-4 text-text shadow-md sm:px-10">

                    <h2 class="text-xs font-medium">
                        Desperdício nos últimos meses
                    </h2>

                    <!-- GRÁFICO APEXCHARTS -->
                    <div id="area-chart"
                        class="mt-4"
                        aria-label="Gráfico de desperdício mensal">
                    </div>
                </section>
            </div>
        </main>

        <!-- RODAPÉ -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- BIBLIOTECA DO GRÁFICO -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.46.0/dist/apexcharts.min.js"></script>

    <!-- COMPONENTES DA PÁGINA -->
    <script src="../../public/js/load-partials.js"></script>

    <!-- DASHBOARD -->
    <script src="../../public/js/dashboard-inicio.js"></script>

</body>
 </html>
