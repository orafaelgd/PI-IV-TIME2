<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Todos os produtos | Sistema de Gestão e Redução de Desperdício</title>

    <!-- ESTILIZAÇÃO -->
    <link rel="stylesheet" href="../../public/css/style.css">
</head>

<body class="flex min-h-screen bg-background">

    <!-- MENU LATERAL -->
    <aside id="aside-placeholder"
        class="w-[180px] shrink-0"></aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="flex min-w-0 flex-1 flex-col">

        <!-- CABEÇALHO -->
        <div id="header-placeholder"></div>

        <main class="flex-1">

            <!-- ESPAÇAMENTO PADRONIZADO -->
            <div class="w-full px-3 py-4 sm:px-6 sm:py-8">

                <!-- CAMINHO DA PÁGINA -->
                <div class="mb-8 flex min-h-[35px] items-center text-base">

                    <span class="text-text-secondary">
                        Produtos
                    </span>

                    <span class="ml-1 font-semibold text-text">
                        / Todos os produtos
                    </span>
                </div>

                <!-- CARD PRINCIPAL -->
                <section class="w-full rounded-md bg-white px-6 py-5">

                    <!-- TÍTULO E BOTÃO ADICIONAR -->
                    <div class="mb-6 flex items-center justify-between">

                        <h1 class="text-base font-semibold text-text">
                            Todos os produtos
                        </h1>

                        <a href="cadastro-produtos.html"
                            title="Cadastrar novo produto"
                            aria-label="Cadastrar novo produto"
                            class="flex h-[28px] w-[28px] items-center justify-center rounded-full bg-primary-dark text-white">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                class="h-4 w-4"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2.5"
                                aria-hidden="true">

                                <path stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M12 5v14m-7-7h14"/>
                            </svg>
                        </a>
                    </div>

                    <!-- BARRA DE PESQUISA DE PRODUTOS -->
                    <div class="mb-6 flex w-full items-center">

                        <div
                            class="flex w-full max-w-[420px] items-center gap-3 rounded-md border border-gray-300 bg-[#e9ebee] px-4 py-2">

                            <!-- ÍCONE DE PESQUISA -->
                            <svg xmlns="http://www.w3.org/2000/svg"
                                class="h-4 w-4 shrink-0 text-text-secondary"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                                aria-hidden="true">

                                <circle cx="11" cy="11" r="7"></circle>
                                <path d="m20 20-4-4"></path>
                            </svg>

                            <!-- CAMPO DE PESQUISA POR NOME -->
                            <input
                                type="search"
                                id="pesquisaProduto"
                                placeholder="Pesquisar produto pelo nome..."
                                aria-label="Pesquisar produto pelo nome"
                                autocomplete="off"
                                class="w-full min-w-0 bg-transparent text-xs text-text outline-none placeholder:text-text-secondary">
                        </div>
                    </div>

                    <!-- TABELA DE PRODUTOS -->
                    <div class="w-full overflow-x-auto">

                        <table class="w-full min-w-[1000px] border-collapse text-left text-xs text-text">

                            <!-- CABEÇALHO PADRONIZADO -->
                            <thead>
                                <tr class="border-b border-gray-400 text-text-secondary">

                                    <th class="px-3 py-2 font-medium">
                                        Título
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Categoria
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Unidade de Medida
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Quantidade Total
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Preço Unitário
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Validade
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Status
                                    </th>

                                    <th class="px-3 py-2 text-center font-medium">
                                        Ações
                                    </th>
                                </tr>
                            </thead>

                            <!-- PRODUTOS DO MONGODB -->
                            <tbody id="tabelaProdutos">

                                <tr>
                                    <td colspan="8"
                                        class="px-3 py-6 text-center text-text-secondary">
                                        Carregando produtos...
                                    </td>
                                </tr>

                            </tbody>
                        </table>
                    </div>

                    <!-- MENSAGEM DE ERRO -->
                    <p id="mensagemErro"
                        class="mt-4 hidden text-xs text-red-600"
                        role="alert"></p>

                </section>
            </div>
        </main>

        <!-- RODAPÉ -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- MODAL DE EXCLUSÃO OU INATIVAÇÃO -->
    <div id="modalProduto"
        class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitulo">

        <div class="w-full max-w-[520px] rounded-lg bg-white p-6 shadow-lg">

            <h2 id="modalTitulo"
                class="mb-4 text-base font-semibold text-text">
            </h2>

            <p id="modalTexto"
                class="mb-6 text-sm text-text">
            </p>

            <!-- BOTÕES DO MODAL -->
            <div class="flex justify-end gap-3">

                <button id="modalCancelar"
                    type="button"
                    class="cursor-pointer rounded border border-gray-400 px-4 py-2 text-xs text-text">
                    Cancelar
                </button>

                <button id="modalConfirmar"
                    type="button"
                    class="cursor-pointer rounded bg-primary-dark px-4 py-2 text-xs font-semibold text-white disabled:opacity-50">
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="../../public/js/load-partials.js"></script>
    <script src="../../public/js/todos-produtos.js"></script>

</body>
</html>
