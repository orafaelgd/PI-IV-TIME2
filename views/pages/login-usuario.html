
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | PsicomManager</title>

  <link rel="stylesheet" href="../../public/css/style.css">
  <style>
    .login-page {
      min-height: 100vh;
      margin: 0;
      background-color: #E5E5E5;
      background-image: url("../../public/images/fundo-login.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: "Manrope", sans-serif;
    }

    .login-container {
      display: flex;
      width: 100%;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .login-container > section {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    .login-card {
      display: block;
      width: 100%;
      padding: 40px 36px;
      margin: 0;
      background-color: #FFFFFF;
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.20);
      box-sizing: border-box;
    }

    .login-card input {
      display: block;
      width: 100%;
      background-color: #FFFFFF;
      border: 1px solid #D6E2E4;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .login-card input:focus {
      border-color: #1F6F78;
      outline: 2px solid rgba(31, 111, 120, 0.12);
    }

    .login-card input[aria-invalid="true"] {
      border-color: #DC2626;
    }

    .login-card input::placeholder {
      color: #9CA3AF;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 16px;
      }

      .login-card {
        padding: 32px 24px;
      }
    }
  </style>
</head>

<body class="min-h-screen bg-[#E5E5E5] font-sans">

  <main
    class="
      flex
      min-h-screen
      items-center
      justify-center
      px-6
      py-10
    "
  >

    <section class="w-full max-w-[520px]">

      <form
        id="formLogin"
        class="login-card"
        novalidate
      >

        <!-- Título -->
        <div class="mb-8">
          <h1 class="text-[26px] font-semibold text-text">
            Login
          </h1>
        </div>

        <!-- E-mail -->
        <div class="mb-5">

          <label
            for="email"
            class="mb-1.5 block text-label text-text"
          >
            E-mail
          </label>

          <input
            id="email"
            name="email"
            type="email"
            required
            maxlength="150"
            autocomplete="email"
            placeholder="Digite aqui"
            aria-describedby="erroEmail"

            class="
              h-[32px]
              w-full
              rounded-[4px]
              border
              border-border
              bg-white
              px-3
              text-[13px]
              text-text
              outline-none
              placeholder:text-text-secondary
              transition
              focus:border-primary
              aria-invalid:border-danger
            "
          >

          <p
            id="erroEmail"
            class="
              mt-1
              hidden
              text-[11px]
              text-danger
            "
          ></p>

        </div>

        <!-- Senha -->
        <div class="mb-2">

          <label
            for="senha"
            class="mb-1.5 block text-label text-text"
          >
            Senha
          </label>

          <div class="relative">

            <input
              id="senha"
              name="senha"
              type="password"
              required
              autocomplete="current-password"
              placeholder="Digite aqui"
              aria-describedby="erroSenha"

              class="
                h-[32px]
                w-full
                rounded-[4px]
                border
                border-border
                bg-white
                px-3
                pr-10
                text-[13px]
                text-text
                outline-none
                placeholder:text-text-secondary
                transition
                focus:border-primary
                aria-invalid:border-danger
              "
            >

            <button
              id="btnMostrarSenha"
              type="button"
              aria-label="Mostrar senha"

              class="
                absolute
                right-3
                top-1/2
                -translate-y-1/2
                cursor-pointer
                text-primary-darker
              "
            >

              <svg
                viewBox="0 0 24 24"
                class="size-[18px]"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >

                <path
                  d="M2.5 12s3.5-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.5 5.5-9.5 5.5S2.5 12 2.5 12Z"
                ></path>

                <circle
                  cx="12"
                  cy="12"
                  r="2.8"
                ></circle>

              </svg>

            </button>

          </div>

          <p
            id="erroSenha"
            class="
              mt-1
              hidden
              text-[11px]
              text-danger
            "
          ></p>

        </div>

        <!-- Esqueceu a senha -->
        <div class="mb-6 text-right">

          <a
            href="#"
            class="
              text-[11px]
              text-text-secondary
              hover:text-primary
              hover:underline
            "
          >
            Esqueceu a senha?
          </a>

        </div>

        <!-- Botão Entrar -->
        <button
          type="submit"
          class="
            flex
            h-[36px]
            w-full
            items-center
            justify-center
            rounded-[7px]
            bg-[#174F54]
            text-[16px]
            text-white
            transition
            hover:bg-[#123F43]
            active:scale-[0.99]
          "
        >
          Entrar
        </button>

        <!-- Criar conta -->
        <p class="mt-3 text-center">

          <a
            href="cadastro-de-usuario.html"
            class="
              text-[11px]
              text-text-secondary
              underline
              hover:text-primary
            "
          >
            Criar uma nova conta
          </a>

        </p>

      </form>

    </section>

  </main>

  <script src="../../public/js/login-de-usuario.js"></script>

</body>
  </html>
