<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Histórico de Saída | Gestão de Desperdício</title>

    <!-- Estilização da página -->
    <link
        rel="stylesheet"
        href="../../public/css/style.css"
    >

    <style>
        /* Filtros de motivo */
        .filtros-motivo {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .botao-filtro {
            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 138px;
            height: 37px;

            padding: 0 14px;

            border: none;
            border-radius: 5px;

            background-color: #e9ebee;
            color: #243547;

            font-size: 12px;
            font-weight: 600;

            cursor: pointer;
            transition: background-color 0.2s;
        }

        .botao-filtro:hover {
            background-color: #d8dde2;
        }

        .botao-filtro.ativo,
        .botao-filtro[aria-pressed="true"] {
            background-color: #195b62;
            color: white;
        }

        .botao-filtro.ativo:hover {
            background-color: #144b50;
        }

        /* Barra de pesquisa */
        .barra-pesquisa {
            display: flex;
            align-items: center;

            width: 100%;
            max-width: 525px;
            min-height: 42px;

            gap: 12px;
            padding: 0 16px;

            border: 1px solid #cbd1d8;
            border-radius: 6px;

            background-color: #e9ebee;
        }

        .barra-pesquisa svg {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
            color: #6b7280;
        }

        .barra-pesquisa input {
            width: 100%;
            min-width: 0;

            border: none;
            outline: none;

            background: transparent;
            color: #243547;

            font-size: 12px;
        }

        .barra-pesquisa input::placeholder {
            color: #6b7280;
        }

        /* Tabela do histórico */
        .tabela-historico {
            width: 100%;
            min-width: 1050px;

            border-collapse: collapse;
            text-align: left;

            font-size: 12px;
        }

        .tabela-historico th,
        .tabela-historico td {
            padding: 12px 15px;
            vertical-align: middle;
        }

        .tabela-historico th {
            font-weight: 500;
        }

        /* Botão de descrição */
        .botao-descricao {
            padding: 6px 12px;

            border: none;
            border-radius: 5px;

            background: transparent;
            color: #195b62;

            font-size: 12px;
            font-weight: 600;

            cursor: pointer;
        }

        .botao-descricao:hover {
            background-color: #d8e7e8;
        }

        /* Texto da descrição */
        .texto-descricao {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.6;
        }

        /* Ajustes para telas menores */
        @media (max-width: 640px) {

            .filtros-motivo {
                gap: 8px;
            }

            .botao-filtro {
                min-width: 105px;
                height: 34px;
                font-size: 11px;
            }

            .barra-pesquisa {
                max-width: 100%;
            }
        }
    </style>
</head>

<body class="flex min-h-screen flex-col bg-background md:flex-row">

    <!-- Menu lateral -->
    <aside
        id="aside-placeholder"
        class="w-full shrink-0 md:w-[180px]">
    </aside>

    <!-- Conteúdo principal -->
    <div class="flex min-w-0 flex-1 flex-col">

        <!-- Cabeçalho -->
        <div id="header-placeholder"></div>

        <main class="flex-1">

            <div class="w-full px-3 py-4 sm:px-6 sm:py-8">

                <!-- Caminho da página -->
                <div class="mb-8 flex min-h-[35px] items-center text-base">

                    <span class="text-text-secondary">
                        Saídas
                    </span>

                    <span class="ml-1 font-semibold text-text">
                        / Histórico de saída
                    </span>
                </div>

                <!-- Área do histórico -->
                <section
                    class="w-full rounded-md bg-white px-6 py-5">

                    <div class="mb-8 flex items-center justify-between">

                        <h1 class="text-base font-semibold text-text">
                            Histórico de saída
                        </h1>
                    </div>

                    <!-- Botões para filtrar pelo motivo da saída -->
                    <div class="filtros-motivo">

                        <button
                            type="button"
                            data-motivo="Todos"
                            aria-pressed="true"
                            class="botao-filtro ativo">

                            Todos
                        </button>

                        <button
                            type="button"
                            data-motivo="Consumido"
                            aria-pressed="false"
                            class="botao-filtro">

                            Consumido
                        </button>

                        <button
                            type="button"
                            data-motivo="Vencimento"
                            aria-pressed="false"
                            class="botao-filtro">

                            Vencimento
                        </button>

                        <button
                            type="button"
                            data-motivo="Contaminado"
                            aria-pressed="false"
                            class="botao-filtro">

                            Contaminado
                        </button>

                        <button
                            type="button"
                            data-motivo="Danificado"
                            aria-pressed="false"
                            class="botao-filtro">

                            Danificado
                        </button>

                        <button
                            type="button"
                            data-motivo="Outro"
                            aria-pressed="false"
                            class="botao-filtro">

                            Outro
                        </button>

                    </div>

                    <!-- Pesquisa pelo nome do produto -->
                    <div class="mb-8 flex w-full items-center">

                        <div class="barra-pesquisa">

                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                                aria-hidden="true">

                                <circle
                                    cx="11"
                                    cy="11"
                                    r="7">
                                </circle>

                                <path d="m20 20-4-4"></path>
                            </svg>

                            <input
                                type="search"
                                id="pesquisaProduto"
                                placeholder="Pesquisar produto pelo nome..."
                                aria-label="Pesquisar produto pelo nome"
                                autocomplete="off">

                        </div>
                    </div>

                    <!-- Tabela com os registros de saída -->
                    <div class="w-full overflow-x-auto">

                        <table class="tabela-historico text-text">

                            <thead>

                                <tr class="border-b border-gray-400 text-text-secondary">

                                    <th>
                                        Produto
                                    </th>

                                    <th class="text-center">
                                        Qtd. de saída
                                    </th>

                                    <th class="text-center">
                                        Motivo
                                    </th>

                                    <th class="text-center">
                                        Data
                                    </th>

                                    <th class="text-center">
                                        Registrado por
                                    </th>

                                    <th class="text-center">
                                        Detalhes
                                    </th>

                                </tr>
                            </thead>

                            <!-- Registros carregados do banco de dados -->
                            <tbody id="historico-desperdicio">

                                <tr>
                                    <td
                                        colspan="6"
                                        class="text-center text-text-secondary">

                                        Carregando histórico...
                                    </td>
                                </tr>

                            </tbody>
                        </table>
                    </div>

                    <!-- Mensagens de erro -->
                    <p
                        id="mensagemErroHistorico"
                        class="mt-4 hidden text-xs text-red-600"
                        role="alert"
                        aria-live="polite">
                    </p>

                </section>
            </div>
        </main>

        <!-- Rodapé -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- Modal para visualizar a descrição de uma saída -->
    <div
        id="modalDescricao"
        class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tituloModalDescricao"
        aria-describedby="textoModalDescricao">

        <section
            class="w-full max-w-[480px] max-h-[90vh] overflow-y-auto rounded-lg bg-white p-6 shadow-lg">

            <!-- Título e botão para fechar -->
            <div class="mb-5 flex items-center justify-between gap-4">

                <h2
                    id="tituloModalDescricao"
                    class="text-lg font-semibold text-text">

                    Descrição da saída
                </h2>

                <button
                    id="fecharModalDescricaoX"
                    type="button"
                    aria-label="Fechar descrição"
                    class="cursor-pointer text-2xl text-text-secondary">

                    &times;
                </button>
            </div>

            <!-- Descrição registrada -->
            <div class="rounded-md bg-[#e9ebee] px-4 py-4">

                <p
                    id="textoModalDescricao"
                    class="texto-descricao text-xs text-text">

                    Nenhuma descrição registrada.
                </p>

            </div>

            <!-- Botão para fechar o modal -->
            <div class="mt-6 flex justify-end">

                <button
                    id="fecharModalDescricao"
                    type="button"
                    class="cursor-pointer rounded bg-primary-dark px-5 py-2 text-xs font-semibold text-white">

                    Fechar
                </button>

            </div>
        </section>
    </div>

    <!-- Scripts da página -->
    <script src="../../public/js/load-partials.js"></script>

    <script src="../../public/js/historico-desperdicio.js"></script>

</body>
</html>
