
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Histórico de Saída | Gestão de Desperdício</title>

    <!-- ESTILIZAÇÃO -->
    <link
        rel="stylesheet"
        href="../../public/css/style.css"
    >
</head>

<body class="flex min-h-screen flex-col bg-background md:flex-row">

    <!-- MENU LATERAL -->
    <aside id="aside-placeholder"
        class="w-full shrink-0 md:w-[180px]">
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="flex min-w-0 flex-1 flex-col">

        <!-- CABEÇALHO -->
        <div id="header-placeholder"></div>

        <main class="flex-1">

            <div class="w-full px-3 py-4 sm:px-6 sm:py-8">

                <!-- CAMINHO DA PÁGINA -->
                <div class="mb-8 flex min-h-[35px] items-center text-base">

                    <span class="text-text-secondary">
                        Saídas
                    </span>

                    <span class="ml-1 font-semibold text-text">
                        / Histórico de saída
                    </span>
                </div>

                <!-- CARD DO HISTÓRICO -->
                <section
                    class="w-full rounded-md bg-white px-6 py-5">

                    <!-- TÍTULO -->
                    <div class="mb-6 flex items-center justify-between">

                        <h1 class="text-base font-semibold text-text">
                            Histórico de saída
                        </h1>
                    </div>

                    <!-- FILTROS POR MOTIVO -->
                    <div class="mb-6 flex flex-wrap items-center gap-3">

                        <!-- TODOS OS MOTIVOS -->
                        <button
                            type="button"
                            data-motivo="Todos"
                            aria-pressed="true"
                            class="flex h-[30px] min-w-[110px] cursor-pointer items-center justify-center rounded bg-primary-dark px-3 text-xs font-semibold text-white">
                            Todos
                        </button>

                        <!-- CONSUMIDO -->
                        <button
                            type="button"
                            data-motivo="Consumido"
                            aria-pressed="false"
                            class="flex h-[30px] min-w-[110px] cursor-pointer items-center justify-center rounded bg-[#e9ebee] px-3 text-xs font-semibold text-text">
                            Consumido
                        </button>

                        <!-- VENCIMENTO -->
                        <button
                            type="button"
                            data-motivo="Vencimento"
                            aria-pressed="false"
                            class="flex h-[30px] min-w-[110px] cursor-pointer items-center justify-center rounded bg-[#e9ebee] px-3 text-xs font-semibold text-text">
                            Vencimento
                        </button>

                        <!-- CONTAMINADO -->
                        <button
                            type="button"
                            data-motivo="Contaminado"
                            aria-pressed="false"
                            class="flex h-[30px] min-w-[110px] cursor-pointer items-center justify-center rounded bg-[#e9ebee] px-3 text-xs font-semibold text-text">
                            Contaminado
                        </button>

                        <!-- DANIFICADO -->
                        <button
                            type="button"
                            data-motivo="Danificado"
                            aria-pressed="false"
                            class="flex h-[30px] min-w-[110px] cursor-pointer items-center justify-center rounded bg-[#e9ebee] px-3 text-xs font-semibold text-text">
                            Danificado
                        </button>

                        <!-- OUTRO -->
                        <button
                            type="button"
                            data-motivo="Outro"
                            aria-pressed="false"
                            class="flex h-[30px] min-w-[110px] cursor-pointer items-center justify-center rounded bg-[#e9ebee] px-3 text-xs font-semibold text-text">
                            Outro
                        </button>
                    </div>

                    <!-- BARRA DE PESQUISA -->
                    <div class="mb-6 flex w-full items-center">

                        <div
                            class="flex w-full max-w-[420px] items-center gap-3 rounded-md border border-gray-300 bg-[#e9ebee] px-4 py-2">

                            <!-- ÍCONE DE PESQUISA -->
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-4 w-4 shrink-0 text-text-secondary"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                                aria-hidden="true">

                                <circle cx="11" cy="11" r="7"></circle>

                                <path d="m20 20-4-4"></path>
                            </svg>

                            <!-- CAMPO DE PESQUISA -->
                            <input
                                type="search"
                                id="pesquisaProduto"
                                placeholder="Pesquisar produto pelo nome..."
                                aria-label="Pesquisar produto pelo nome"
                                autocomplete="off"
                                class="w-full min-w-0 bg-transparent text-xs text-text outline-none placeholder:text-text-secondary">
                        </div>
                    </div>

                    <!-- TABELA DO HISTÓRICO -->
                    <div class="w-full overflow-x-auto">

                        <table
                            class="w-full min-w-[850px] border-collapse text-left text-xs text-text">

                            <!-- CABEÇALHO -->
                            <thead>

                                <tr class="border-b border-gray-400 text-text-secondary">

                                    <th class="px-3 py-2 font-medium">
                                        Produto
                                    </th>

                                    <th class="px-3 py-2 text-center font-medium">
                                        Qtd. de saída
                                    </th>

                                    <th class="px-3 py-2 text-center font-medium">
                                        Motivo
                                    </th>

                                    <th class="px-3 py-2 text-center font-medium">
                                        Data
                                    </th>

                                    <th class="px-3 py-2 text-center font-medium">
                                        Registrado por
                                    </th>
                                </tr>
                            </thead>

                            <!-- REGISTROS DO MONGODB -->
                            <tbody id="historico-desperdicio">

                                <tr>
                                    <td
                                        colspan="5"
                                        class="px-3 py-6 text-center text-text-secondary">
                                        Carregando histórico...
                                    </td>
                                </tr>

                            </tbody>
                        </table>
                    </div>

                    <!-- MENSAGENS DE ERRO -->
                    <p
                        id="mensagemErroHistorico"
                        class="mt-4 hidden text-xs text-red-600"
                        role="alert"
                        aria-live="polite">
                    </p>

                </section>
            </div>
        </main>

        <!-- RODAPÉ -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- COMPONENTES COMPARTILHADOS -->
    <script src="../../public/js/load-partials.js"></script>

    <!-- HISTÓRICO DE SAÍDA -->
    <script src="../../public/js/historico-desperdicio.js"></script>

</body>
</html>
