

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Próximos do vencimento | Gestão de Desperdício</title>

    <!-- ESTILIZAÇÃO -->
    <link rel="stylesheet"
        href="../../public/css/style.css">
</head>

<body class="flex min-h-screen bg-background">

    <!-- MENU LATERAL -->
    <aside id="aside-placeholder"
        class="w-[180px] shrink-0"></aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="flex min-w-0 flex-1 flex-col">

        <!-- CABEÇALHO -->
        <div id="header-placeholder"></div>

        <main class="flex-1">

            <!-- ESPAÇAMENTO PADRONIZADO -->
            <div class="w-full px-3 py-4 sm:px-6 sm:py-8">

                <!-- CAMINHO DA PÁGINA -->
                <div class="mb-8 flex min-h-[35px] items-center text-base">

                    <span class="text-text-secondary">
                        Lotes
                    </span>

                    <span class="ml-1 font-semibold text-text">
                        / Próximos do vencimento
                    </span>
                </div>

                <!-- CARD PRINCIPAL -->
                <section
                    class="w-full rounded-md bg-white px-6 py-5">

                    <!-- TÍTULO -->
                    <div class="mb-6 flex items-center justify-between">

                        <h1 class="text-base font-semibold text-text">
                            Próximos do vencimento
                        </h1>
                    </div>

                    <!-- FILTROS DE VENCIMENTO -->
                    <div class="mb-6 flex flex-wrap items-center gap-3">

                        <!-- HOJE - FILTRO INICIAL -->
                        <button
                            type="button"
                            data-dias="1"
                            aria-pressed="true"
                            class="flex h-[30px] min-w-[110px] cursor-pointer items-center justify-center rounded bg-primary-dark px-3 text-xs font-semibold text-white">

                            Hoje
                        </button>

                        <!-- PRÓXIMOS 3 DIAS -->
                        <button
                            type="button"
                            data-dias="3"
                            aria-pressed="false"
                            class="flex h-[30px] min-w-[110px] cursor-pointer items-center justify-center rounded bg-[#e9ebee] px-3 text-xs font-semibold text-text">

                            Próx. 3 dias
                        </button>

                        <!-- PRÓXIMOS 7 DIAS -->
                        <button
                            type="button"
                            data-dias="7"
                            aria-pressed="false"
                            class="flex h-[30px] min-w-[110px] cursor-pointer items-center justify-center rounded bg-[#e9ebee] px-3 text-xs font-semibold text-text">

                            Próx. 7 dias
                        </button>

                        <!-- PRÓXIMOS 15 DIAS -->
                        <button
                            type="button"
                            data-dias="15"
                            aria-pressed="false"
                            class="flex h-[30px] min-w-[110px] cursor-pointer items-center justify-center rounded bg-[#e9ebee] px-3 text-xs font-semibold text-text">

                            Próx. 15 dias
                        </button>

                        <!-- PRÓXIMOS 30 DIAS -->
                        <button
                            type="button"
                            data-dias="30"
                            aria-pressed="false"
                            class="flex h-[30px] min-w-[110px] cursor-pointer items-center justify-center rounded bg-[#e9ebee] px-3 text-xs font-semibold text-text">

                            Próx. 30 dias
                        </button>
                    </div>

                    <!-- BARRA DE PESQUISA -->
                    <div class="mb-6 flex w-full items-center">

                        <div
                            class="flex w-full max-w-[420px] items-center gap-3 rounded-md border border-gray-300 bg-[#e9ebee] px-4 py-2">

                            <!-- ÍCONE DE PESQUISA -->
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="h-4 w-4 shrink-0 text-text-secondary"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                                aria-hidden="true">

                                <circle cx="11" cy="11" r="7"></circle>

                                <path d="m20 20-4-4"></path>
                            </svg>

                            <!-- CAMPO DE PESQUISA -->
                            <input
                                type="search"
                                id="pesquisaProduto"
                                placeholder="Pesquisar produto pelo nome..."
                                aria-label="Pesquisar produto pelo nome"
                                autocomplete="off"
                                class="w-full min-w-0 bg-transparent text-xs text-text outline-none placeholder:text-text-secondary">

                        </div>
                    </div>

                    <!-- TABELA DE VENCIMENTOS -->
                    <div class="w-full overflow-x-auto">

                        <table
                            class="w-full min-w-[760px] border-collapse text-left text-xs text-text">

                            <!-- CABEÇALHO DA TABELA -->
                            <thead>

                                <tr class="border-b border-gray-400 text-text-secondary">

                                    <th class="px-3 py-2 font-medium">
                                        Produto
                                    </th>

                                    <th class="px-3 py-2 font-medium">
                                        Código do lote
                                    </th>

                                    <th class="px-3 py-2 text-center font-medium">
                                        Qtd. disponível
                                    </th>

                                    <th class="px-3 py-2 text-center font-medium">
                                        Validade
                                    </th>

                                    <th class="px-3 py-2 text-center font-medium">
                                        Ações
                                    </th>
                                </tr>
                            </thead>

                            <!-- LOTES RETORNADOS PELO MONGODB -->
                            <tbody id="lista-vencimentos">

                                <tr>
                                    <td colspan="5"
                                        class="px-3 py-6 text-center text-text-secondary">

                                        Carregando lotes...
                                    </td>
                                </tr>
                            </tbody>

                        </table>
                    </div>

                    <!-- MENSAGENS DE ERRO -->
                    <p
                        id="mensagem-vencimentos"
                        class="mt-4 hidden text-xs text-red-600"
                        role="alert"
                        aria-live="polite">
                    </p>

                </section>
            </div>
        </main>

        <!-- RODAPÉ -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- COMPONENTES COMPARTILHADOS -->
    <script src="../../public/js/load-partials.js"></script>

    <!-- PRÓXIMOS VENCIMENTOS -->
    <script src="../../public/js/proximos-vencimento.js"></script>

</body>
</html>
