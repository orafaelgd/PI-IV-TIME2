<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Recuperar senha | PsicomManager</title>

  <!-- Estilização da página -->
  <link rel="stylesheet" href="../../public/css/style.css">

  <style>
    /* Fundo da página */
    .login-page {
      min-height: 100vh;
      margin: 0;
      background-color: #E5E5E5;
      background-image: url("../../public/images/fundo-login.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: "Manrope", sans-serif;
    }

    /* Centralização do formulário */
    .login-container {
      display: flex;
      width: 100%;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .login-container > section { width: 100%; max-width: 420px; margin: 0 auto; }

    /* Estilo do card de recuperação */
    .login-card {
      display: block;
      width: 100%;
      padding: 40px 36px;
      margin: 0;
      background-color: #FFFFFF;
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .20);
      box-sizing: border-box;
    }

    /* Campos do formulário */
    .login-card input {
      display: block;
      width: 100%;
      height: 36px;
      padding: 0 12px;
      background-color: #FFFFFF;
      border: 1px solid #D6E2E4;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
      color: #1F2937;
    }

    .login-card input:focus { border-color: #1F6F78; outline: 2px solid rgba(31,111,120,.12); }
    .login-card input[aria-invalid="true"] { border-color: #DC2626; }
    .login-card input::placeholder { color: #9CA3AF; }

    /* Textos e mensagens do formulário */
    .login-title { font-size: 26px; font-weight: 600; color: #1F2937; margin: 0 0 14px; }
    .login-description { font-size: 13px; line-height: 1.6; color: #6B7280; margin: 0 0 24px; }
    .login-field { margin-bottom: 18px; }
    .login-field label { display: block; margin-bottom: 7px; font-size: 14px; color: #1F2937; }
    .login-error { margin-top: 6px; font-size: 12px; color: #DC2626; }
    .login-feedback { margin: 14px 0; font-size: 13px; line-height: 1.6; color: #195A61; }
    .login-error[hidden], .login-feedback[hidden], .login-card [hidden] { display: none !important; }

    /* Botão de envio */
    .login-button {
      display: flex;
      width: 100%;
      height: 38px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 7px;
      color: white;
      background: #174F54;
      font-size: 16px;
      cursor: pointer;
    }

    .login-button:hover { background: #123F43; }
    .login-button:disabled { opacity: .65; cursor: wait; }

    /* Link para voltar ao login */
    .login-link { display: block; margin-top: 16px; text-align: center; font-size: 12px; color: #6B7280; text-decoration: underline; }

    /* Ajustes para telas menores */
    @media (max-width: 480px) {
      .login-container { padding: 16px; }
      .login-card { padding: 32px 24px; }
    }
  </style>
</head>

<body class="login-page">

  <!-- Conteúdo principal -->
  <main class="login-container">
    <section>

      <!-- Formulário de recuperação de senha -->
      <form id="formRecuperarSenha" class="login-card" novalidate>

        <!-- Título e instruções -->
        <h1 class="login-title">Recuperar senha</h1>
        <p class="login-description">Informe seu e-mail cadastrado. Se ele estiver em nossa base, enviaremos um link para redefinir sua senha.</p>

        <!-- Campo de e-mail -->
        <div class="login-field">
          <label for="email">E-mail</label>
          <input id="email" type="email" name="email" maxlength="150" required autocomplete="email" placeholder="Digite seu e-mail" aria-describedby="erroEmail">
          <p id="erroEmail" class="login-error" role="alert" hidden></p>
        </div>

        <!-- Botão para solicitar o link -->
        <button id="btnEnviar" class="login-button" type="submit">Enviar link</button>

        <!-- Mensagem de confirmação -->
        <p id="mensagem" class="login-feedback" role="status" aria-live="polite" hidden></p>

        <!-- Voltar para a tela de login -->
        <a class="login-link" href="login-usuario.html">Voltar para o Login</a>

      </form>
    </section>
  </main>

  <!-- Script de recuperação de senha -->
  <script src="../../public/js/recuperar-senha.js"></script>

</body>
</html>
